<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFlux | Discover Cinema</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <i class="fa-solid fa-circle-play logo-icon"></i><span>CineFlux</span>
      </div>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input
          type="text"
          id="searchInput"
          placeholder="Search movies..."
          autocomplete="off"
        />
        <button id="clearBtn" class="clear-btn">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button id="searchBtn"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <div class="user-actions">
        <button class="login-btn" id="loginTrigger">
          <i class="fa-regular fa-user"></i><span>Sign In</span>
        </button>
        <button class="hamburger" id="hamburgerBtn">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-container">
      <aside class="sidebar" id="sidebar">
        <button class="sidebar-close" id="sidebarClose">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="sidebar-section">
          <h3>Genres</h3>
          <ul>
            <li class="category-item active" data-id="all">
              <i class="fa-solid fa-border-all"></i>All
            </li>
            <li class="category-item" data-id="28">
              <i class="fa-solid fa-bomb"></i>Action
            </li>
            <li class="category-item" data-id="878">
              <i class="fa-solid fa-rocket"></i>Sci-Fi
            </li>
            <li class="category-item" data-id="35">
              <i class="fa-solid fa-face-laugh"></i>Comedy
            </li>
            <li class="category-item" data-id="18">
              <i class="fa-solid fa-heart-crack"></i>Drama
            </li>
            <li class="category-item" data-id="27">
              <i class="fa-solid fa-ghost"></i>Horror
            </li>
          </ul>
        </div>
        <div class="sidebar-section">
          <h3>Sort By</h3>
          <ul>
            <li class="sort-item active" data-sort="popularity.desc">
              <i class="fa-solid fa-fire"></i>Most Popular
            </li>
            <li class="sort-item" data-sort="vote_average.desc">
              <i class="fa-solid fa-star"></i>Top Rated
            </li>
            <li class="sort-item" data-sort="release_date.desc">
              <i class="fa-solid fa-calendar"></i>Newest
            </li>
          </ul>
        </div>
      </aside>

      <main class="content">
        <section class="trending-section" id="trendingSection">
          <div class="section-header">
            <h2 class="section-title">
              <span class="title-accent">Trending</span> This Week
            </h2>
            <div class="title-line"></div>
          </div>
          <div class="carousel-container">
            <div class="carousel-track" id="trendingTrack"></div>
          </div>
        </section>

        <section class="grid-section">
          <div class="section-header">
            <h2 class="section-title" id="sectionTitle">
              <span class="title-accent">Top</span> Rated
            </h2>
            <div class="title-line"></div>
          </div>
          <div class="movie-grid" id="topRatedGrid"></div>
          <div
            class="load-more-wrapper"
            id="loadMoreWrapper"
            style="display: none"
          >
            <button class="load-more-btn" id="loadMoreBtn">
              <i class="fa-solid fa-circle-plus"></i>Load More
            </button>
          </div>
          <div class="error-state" id="errorState" style="display: none">
            <i class="fa-solid fa-satellite-dish"></i>
            <h3>Connection Error</h3>
            <button class="retry-btn" id="retryBtn">Try Again</button>
          </div>
        </section>
      </main>
    </div>

    <!-- Modal -->
    <div id="movieModal" class="modal">
      <div class="modal-content">
        <button class="close-btn" id="closeModalBtn">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-body">
          <div class="modal-poster-wrap">
            <img id="modalImg" src="" />
            <div class="modal-poster-glow"></div>
          </div>
          <div class="modal-info">
            <div class="modal-genres" id="modalGenres"></div>
            <h2 id="modalTitle"></h2>
            <div class="modal-meta">
              <span class="rating-badge"
                ><i class="fa-solid fa-star"></i
                ><span id="modalRatingVal">—</span></span
              >
            </div>
            <p id="modalDesc"></p>
            <div class="modal-actions">
              <button class="play-trailer-btn" id="playTrailerBtn">
                Watch Trailer</button
              ><button class="watchlist-btn" id="watchlistBtn">
                <i class="fa-regular fa-bookmark"></i>
              </button>
            </div>
            <div class="modal-cast" id="modalCast"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="trailerModal" class="trailer-modal">
      <div class="trailer-content">
        <button class="trailer-close" id="closeTrailerBtn">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="trailer-frame-wrap">
          <iframe
            id="trailerFrame"
            src=""
            frameborder="0"
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>

    <div id="loginModal" class="login-modal">
      <div class="login-content">
        <button class="close-btn login-close" id="closeLoginBtn">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="login-logo">CineFlux</div>
        <h2>Welcome Back</h2>
        <div class="login-form">
          <div class="form-group">
            <i class="fa-regular fa-envelope"></i
            ><input type="email" placeholder="Email" />
          </div>
          <div class="form-group">
            <i class="fa-solid fa-lock"></i
            ><input type="password" placeholder="Password" />
          </div>
          <button class="form-submit-btn">Sign In</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-logo">CineFlux</div>
        <p>&copy; 2026</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
